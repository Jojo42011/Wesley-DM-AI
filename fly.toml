# Fly.io configuration for the Wesley TikTok DM agent.
app = "wesley-dm-ai"
primary_region = "dfw"

[build]

[env]
  SQLITE_PATH = "/data/wesley.db"

# SQLite lives on this volume — single always-on machine, no external DB.
[mounts]
  source = "wesley_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
